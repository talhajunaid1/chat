<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeerPulse – Chat with a Friend</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 px-4 md:px-6 py-3 flex items-center justify-between shadow-xl">
        <div class="flex items-center space-x-3">
            <div class="bg-gradient-to-tr from-indigo-600 to-violet-500 p-2.5 rounded-xl text-white">
                <i class="fa-solid fa-comments text-lg"></i>
            </div>
            <div>
                <h1 class="text-base font-bold text-white">PeerPulse</h1>
                <p class="text-[11px] text-slate-400">Real-time WebSocket chat</p>
            </div>
        </div>
        <div class="flex items-center space-x-2 bg-slate-800/90 px-3.5 py-1.5 rounded-full border border-slate-700 text-xs font-medium">
            <span id="status-dot" class="w-2.5 h-2.5 rounded-full bg-rose-500"></span>
            <span id="status-text" class="text-slate-300">Disconnected</span>
        </div>
    </header>

    <!-- Controls bar -->
    <div class="bg-slate-900/80 border-b border-slate-800 px-4 md:px-6 py-3">
        <div class="flex flex-col md:flex-row gap-2 md:items-end max-w-5xl mx-auto">
            <div class="flex-1">
                <label class="block text-[11px] font-medium text-slate-400 mb-1">Your name</label>
                <input id="input-username" maxlength="24" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
            </div>
            <div class="flex-[2]">
                <label class="block text-[11px] font-medium text-slate-400 mb-1">Room code (you and your friend must use the same one)</label>
                <input id="input-room" maxlength="60" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:border-indigo-500">
            </div>
            <div class="flex gap-2">
                <button id="btn-join" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg text-xs font-semibold transition">
                    <i class="fa-solid fa-plug mr-1"></i> Join
                </button>
                <button id="btn-copy" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-xs font-semibold transition">
                    <i class="fa-solid fa-link mr-1"></i> Copy invite link
                </button>
            </div>
        </div>
    </div>

    <!-- Messages -->
    <main id="chat-messages" class="flex-1 p-4 md:p-6 overflow-y-auto custom-scrollbar space-y-3 max-w-5xl w-full mx-auto"></main>

    <!-- Input -->
    <div class="bg-slate-900 border-t border-slate-800 p-3 md:p-4">
        <form id="chat-form" class="flex items-center space-x-3 max-w-5xl mx-auto">
            <input id="message-input" autocomplete="off" placeholder="Type a message..."
                   class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm placeholder-slate-500 focus:outline-none focus:border-indigo-500">
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-3 rounded-xl text-sm font-semibold transition flex items-center space-x-2">
                <span>Send</span><i class="fa-solid fa-paper-plane text-xs"></i>
            </button>
        </form>
        <p class="text-center text-[10px] text-slate-500 mt-2">
            Anyone who knows the room code can read this chat. Use a long, random code and don't share sensitive info.
        </p>
    </div>

    <script>
    (function () {
        // ---------- Config ----------
        // ntfy.sh = free public pub/sub. Receive over WebSocket, send over HTTPS POST.
        const NTFY_HOST = "ntfy.sh";
        const TOPIC_PREFIX = "peerpulse-";

        // ---------- State ----------
        const clientId = Math.random().toString(36).slice(2) + Date.now().toString(36);
        let username = localStorage.getItem("pp_name") || ("Friend_" + Math.floor(100 + Math.random() * 900));
        let room = getRoomFromUrl() || localStorage.getItem("pp_room") || ("room-" + randomCode(10));
        let ws = null;
        let generation = 0;          // ignores events from old sockets
        let reconnectTimer = null;
        let retry = 0;
        let seen = new Set();        // de-duplicate messages

        // ---------- Elements ----------
        const $ = (id) => document.getElementById(id);
        const elMsgs = $("chat-messages");
        const elName = $("input-username");
        const elRoom = $("input-room");
        const elInput = $("message-input");

        elName.value = username;
        elRoom.value = room;

        // ---------- Helpers ----------
        function randomCode(n) {
            const chars = "abcdefghjkmnpqrstuvwxyz23456789";
            const arr = new Uint32Array(n);
            crypto.getRandomValues(arr);
            return Array.from(arr, (x) => chars[x % chars.length]).join("");
        }
        function getRoomFromUrl() {
            const m = location.hash.match(/room=([^&]+)/);
            return m ? decodeURIComponent(m[1]) : null;
        }
        function topic() {
            return TOPIC_PREFIX + room.toLowerCase().replace(/[^a-z0-9_-]/g, "-");
        }
        function inviteLink() {
            return location.origin + location.pathname + "#room=" + encodeURIComponent(room);
        }
        function setStatus(state, label) {
            const dot = $("status-dot");
            dot.className = "w-2.5 h-2.5 rounded-full " +
                (state === "connected" ? "bg-emerald-500 animate-pulse"
                : state === "connecting" ? "bg-amber-500 animate-pulse"
                : "bg-rose-500");
            $("status-text").textContent = label;
        }
        function scrollDown() { elMsgs.scrollTop = elMsgs.scrollHeight; }

        function addSystem(text) {
            const wrap = document.createElement("div");
            wrap.className = "flex justify-center";
            const pill = document.createElement("div");
            pill.className = "bg-slate-900/80 border border-slate-800 text-slate-400 text-xs px-3.5 py-1.5 rounded-full text-center";
            pill.textContent = text;
            wrap.appendChild(pill);
            elMsgs.appendChild(wrap);
            scrollDown();
        }

        function addChat(sender, text, time, isSelf) {
            const wrap = document.createElement("div");
            wrap.className = "flex flex-col " + (isSelf ? "items-end" : "items-start");

            const meta = document.createElement("div");
            meta.className = "flex items-center space-x-2 mb-1 px-1";
            const n = document.createElement("span");
            n.className = "text-xs font-semibold " + (isSelf ? "text-indigo-400" : "text-slate-300");
            n.textContent = sender;
            const t = document.createElement("span");
            t.className = "text-[10px] text-slate-500";
            t.textContent = time || "";
            meta.append(n, t);

            const bubble = document.createElement("div");
            bubble.className = "max-w-[85%] md:max-w-[65%] rounded-2xl px-4 py-2.5 text-sm leading-relaxed break-words whitespace-pre-wrap " +
                (isSelf ? "bg-indigo-600 text-white rounded-br-none"
                        : "bg-slate-900 text-slate-100 border border-slate-800 rounded-bl-none");
            bubble.textContent = text;

            wrap.append(meta, bubble);
            elMsgs.appendChild(wrap);
            scrollDown();
        }

        // ---------- WebSocket (receive) ----------
        function connect(announce) {
            clearTimeout(reconnectTimer);
            const myGen = ++generation;
            if (ws) { try { ws.close(); } catch (e) {} }

            setStatus("connecting", "Connecting...");
            const url = "wss://" + NTFY_HOST + "/" + encodeURIComponent(topic()) + "/ws";

            try {
                ws = new WebSocket(url);
            } catch (err) {
                setStatus("disconnected", "Failed");
                addSystem("Could not open WebSocket: " + err.message);
                scheduleReconnect(myGen);
                return;
            }
            const sock = ws;

            sock.onopen = () => {
                if (myGen !== generation) return;
                retry = 0;
                setStatus("connected", "Connected");
                if (announce) {
                    addSystem("Connected to room \"" + room + "\". Share the invite link with your friend.");
                    publish({ type: "system", text: username + " joined the room." });
                } else {
                    addSystem("Reconnected.");
                }
            };

            sock.onmessage = (ev) => {
                if (myGen !== generation) return;
                let outer;
                try { outer = JSON.parse(ev.data); } catch (e) { return; }
                if (outer.event !== "message" || !outer.message) return;

                let data;
                try { data = JSON.parse(outer.message); }
                catch (e) { data = { type: "chat", sender: "Peer", text: outer.message, id: outer.id }; }

                const id = data.id || outer.id;
                if (id) {
                    if (seen.has(id)) return;
                    seen.add(id);
                    if (seen.size > 500) seen = new Set(Array.from(seen).slice(-250));
                }

                if (data.type === "chat") {
                    addChat(data.sender || "Peer", data.text || "", data.time, data.cid === clientId);
                } else if (data.type === "system") {
                    addSystem(data.text || "");
                }
            };

            sock.onerror = () => {
                if (myGen !== generation) return;
                console.error("WebSocket error");
            };

            sock.onclose = () => {
                if (myGen !== generation) return; // intentional close / replaced socket
                setStatus("disconnected", "Disconnected");
                scheduleReconnect(myGen);
            };
        }

        function scheduleReconnect(myGen) {
            if (myGen !== generation) return;
            const delay = Math.min(1000 * Math.pow(2, retry++), 15000);
            setStatus("connecting", "Reconnecting...");
            reconnectTimer = setTimeout(() => connect(false), delay);
        }

        // ---------- Publish (send) ----------
        async function publish(payload) {
            const body = JSON.stringify(Object.assign({
                id: clientId + "-" + Date.now() + "-" + Math.random().toString(36).slice(2, 6),
                cid: clientId
            }, payload));
            try {
                const res = await fetch("https://" + NTFY_HOST + "/" + encodeURIComponent(topic()), {
                    method: "POST",
                    body: body
                });
                if (!res.ok) throw new Error("HTTP " + res.status);
                return true;
            } catch (err) {
                addSystem("Message failed to send (" + err.message + "). You may be rate limited — wait a moment and try again.");
                return false;
            }
        }

        // ---------- UI events ----------
        $("chat-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const text = elInput.value.trim();
            if (!text) return;
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                addSystem("Not connected yet. Click Join.");
                return;
            }
            elInput.value = "";
            const ok = await publish({
                type: "chat",
                sender: username,
                text: text,
                time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
            });
            if (!ok) elInput.value = text;
        });

        function applyName() {
            const v = elName.value.trim();
            if (v) { username = v; localStorage.setItem("pp_name", v); }
        }
        elName.addEventListener("change", applyName);

        function joinRoom() {
            applyName();
            const v = elRoom.value.trim();
            if (!v) return;
            room = v;
            localStorage.setItem("pp_room", room);
            history.replaceState(null, "", "#room=" + encodeURIComponent(room));
            seen.clear();
            elMsgs.innerHTML = "";
            connect(true);
        }
        $("btn-join").addEventListener("click", joinRoom);
        elRoom.addEventListener("keydown", (e) => { if (e.key === "Enter") joinRoom(); });

        $("btn-copy").addEventListener("click", async () => {
            const link = inviteLink();
            try {
                await navigator.clipboard.writeText(link);
                addSystem("Invite link copied. Send it to your friend!");
            } catch (e) {
                prompt("Copy this invite link:", link);
            }
        });

        // ---------- Start ----------
        history.replaceState(null, "", "#room=" + encodeURIComponent(room));
        localStorage.setItem("pp_room", room);
        connect(true);
    })();
    </script>
</body>
</html>
